<svg id="smartstock-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Stacked-layers mark used across the app (Sidebar.tsx's collapsed
       icon rail, and cropped into the full lockups in
       smartstock-nwu-logo.svg / smartstock-nwu-logo-light.svg). Keep this
       <defs>/<rect>/<g> in sync across all three files if the mark itself
       ever changes. -->
  <defs>
    <linearGradient id="cubeBg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#311149" />
      <stop offset="55%" stop-color="#632c8c" />
      <stop offset="100%" stop-color="#9955d4" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="96" height="96" rx="20" fill="url(#cubeBg)" stroke="#c084fc" stroke-opacity="0.35" stroke-width="2" />
  <g transform="translate(20,20) scale(2.5)" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
  </g>
</svg>
