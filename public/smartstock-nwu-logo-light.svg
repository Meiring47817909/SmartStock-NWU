<svg id="smartstock-svg-active-light" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120">
  <!-- Stacked-layers lockup for dark backgrounds (the admin sidebar's
       purple gradient header, Sidebar.tsx). Same icon mark as
       smartstock-nwu-icon.svg; smartstock-nwu-logo.svg is this same
       lockup recoloured for light backgrounds (login page, lending portal
       header). Keep the icon <defs>/<rect>/<g> and the wordmark <text>
       baseline in sync across all three files if the mark or layout
       changes. -->
  <defs>
    <linearGradient id="cubeBg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#311149" />
      <stop offset="55%" stop-color="#632c8c" />
      <stop offset="100%" stop-color="#9955d4" />
    </linearGradient>
  </defs>
  <rect x="12" y="10" width="100" height="100" rx="20" fill="url(#cubeBg)" stroke="#c084fc" stroke-opacity="0.35" stroke-width="2" />
  <g transform="translate(30,30) scale(2.5)" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
  </g>
  <text x="132" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" letter-spacing="-0.5" fill="#FFFFFF">SmartStock</text>
</svg>
